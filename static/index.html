<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>ANUBIS — Portfolio Intelligence</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg:      #080c18; --card:    #0d1526; --card2:   #111d35;
    --border:  #1a2d50; --border2: #1e3560;
    --text:    #e2e8f0; --muted:   #64748b; --accent:  #06b6d4;
    --gold:    #f59e0b; --green:   #22c55e; --red:     #ef4444;
    --orange:  #f97316; --purple:  #a855f7; --blue:    #3b82f6;
    --radius:  12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; min-height: 100vh; }

  /* ── Layout ── */
  .app { max-width: 1400px; margin: 0 auto; padding: 0 16px 40px; }

  /* ── Header ── */
  .header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 0; border-bottom: 1px solid var(--border);
    margin-bottom: 24px;
  }
  .header-brand { display: flex; align-items: center; gap: 12px; }
  .header-logo {
    width: 44px; height: 44px; background: linear-gradient(135deg, #06b6d4, #a855f7);
    border-radius: 10px; display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 900; color: #fff;
  }
  .header-title { font-size: 22px; font-weight: 700; letter-spacing: 1px; color: var(--accent); }
  .header-sub { font-size: 11px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; }
  .header-status { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 6px var(--green); }
  .dot.offline { background: var(--red); box-shadow: 0 0 6px var(--red); }

  /* ── Cards ── */
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 20px;
  }
  .card-title { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted); margin-bottom: 14px; }

  /* ── Overview bar ── */
  .overview {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 14px; margin-bottom: 24px;
  }
  .ov-card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 18px; display: flex; flex-direction: column; gap: 6px;
    transition: border-color .2s;
  }
  .ov-card:hover { border-color: var(--accent); }
  .ov-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted); }
  .ov-value { font-size: 26px; font-weight: 800; }
  .ov-sub { font-size: 12px; color: var(--muted); }

  /* ── Stage badge ── */
  .stage-badge {
    display: inline-flex; align-items: center; justify-content: center;
    width: 36px; height: 36px; border-radius: 50%;
    font-size: 15px; font-weight: 800; border: 2.5px solid;
    flex-shrink: 0;
  }

  /* ── Main grid ── */
  .main-grid { display: grid; grid-template-columns: 1fr 380px; gap: 20px; margin-bottom: 20px; }
  @media (max-width: 900px) { .main-grid { grid-template-columns: 1fr; } }

  /* ── Holding card ── */
  .holding-card {
    background: var(--card2); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px; display: flex; flex-direction: column; gap: 8px;
    transition: border-color .2s, transform .15s;
    cursor: default;
  }
  .holding-card:hover { border-color: var(--accent); transform: translateY(-1px); }
  .holding-card.false-light { border-color: var(--orange); background: #1a1300; }
  .holding-card.critical    { border-color: var(--red);    background: #1a0808; }
  .holding-top { display: flex; align-items: center; gap: 10px; }
  .h-ticker { font-size: 16px; font-weight: 800; flex: 1; }
  .h-price  { font-size: 15px; font-weight: 700; }
  .h-chg    { font-size: 12px; font-weight: 600; }
  .holding-dims { display: flex; gap: 6px; flex-wrap: wrap; }
  .dim-pill {
    font-size: 10px; padding: 2px 8px; border-radius: 20px;
    background: rgba(6,182,212,.12); color: var(--accent); border: 1px solid rgba(6,182,212,.25);
  }
  .trap-bar { display: flex; align-items: center; gap: 8px; }
  .trap-bar-track { flex: 1; height: 4px; background: var(--border2); border-radius: 2px; overflow: hidden; }
  .trap-bar-fill { height: 100%; border-radius: 2px; transition: width .5s; }
  .trap-label { font-size: 10px; color: var(--muted); min-width: 80px; }
  .fl-badge { font-size: 9px; padding: 2px 6px; border-radius: 4px; background: var(--orange); color: #000; font-weight: 700; letter-spacing: .5px; }
  .holding-desc { font-size: 11px; color: var(--muted); line-height: 1.5; }

  /* ── Right panel ── */
  .right-stack { display: flex; flex-direction: column; gap: 16px; }

  /* ── Trajectory ── */
  .traj-label { font-size: 22px; font-weight: 800; letter-spacing: 1px; }
  .traj-metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .traj-metric { background: var(--card2); border-radius: 8px; padding: 10px 12px; }
  .traj-metric-label { font-size: 9px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
  .traj-metric-val { font-size: 20px; font-weight: 800; margin-top: 2px; }

  /* ── Yunus score ── */
  .yunus-score-display { text-align: center; padding: 10px 0; }
  .yunus-number { font-size: 48px; font-weight: 900; line-height: 1; }
  .yunus-ring { position: relative; width: 100px; height: 100px; margin: 0 auto 10px; }
  .yunus-ring svg { transform: rotate(-90deg); }
  .yunus-ring-label { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 900; }
  .score-track { height: 8px; background: var(--border2); border-radius: 4px; overflow: hidden; margin-top: 8px; }
  .score-fill  { height: 100%; border-radius: 4px; transition: width .6s ease; }

  /* ── Harrowing ── */
  .harrowing-status { padding: 12px; border-radius: 8px; border: 1px solid; }
  .harrowing-status.active   { background: rgba(239,68,68,.08); border-color: var(--red); }
  .harrowing-status.normal   { background: rgba(34,197,94,.06); border-color: var(--green); }
  .harrowing-status.quarantine { background: rgba(168,85,247,.1); border-color: var(--purple); }

  /* ── Systemic alert banner ── */
  .systemic-banner {
    border-radius: var(--radius); padding: 14px 18px; margin-bottom: 20px;
    border: 1px solid; display: flex; align-items: center; gap: 14px;
  }
  .systemic-icon { font-size: 28px; }
  .systemic-label { font-size: 13px; font-weight: 700; letter-spacing: .5px; }
  .systemic-desc  { font-size: 12px; color: var(--muted); margin-top: 2px; }

  /* ── Threats ── */
  .threat-item { display: flex; align-items: flex-start; gap: 10px; padding: 10px; background: var(--card2); border-radius: 8px; margin-bottom: 8px; border-left: 3px solid; }
  .threat-sev { font-size: 9px; font-weight: 700; letter-spacing: 1px; padding: 2px 6px; border-radius: 4px; white-space: nowrap; }
  .threat-desc { font-size: 12px; color: var(--muted); margin-top: 2px; }

  /* ── Rebalance ── */
  .rebalance-row { display: flex; align-items: center; gap: 8px; padding: 10px; background: var(--card2); border-radius: 8px; margin-bottom: 8px; font-size: 12px; }
  .rb-from { color: var(--red); font-weight: 700; }
  .rb-to   { color: var(--green); font-weight: 700; }
  .rb-pct  { margin-left: auto; font-weight: 800; color: var(--accent); }

  /* ── Yunus scanner ── */
  .scanner-input { width: 100%; background: var(--card2); border: 1px solid var(--border2); color: var(--text); border-radius: 8px; padding: 12px; font-size: 13px; resize: vertical; min-height: 80px; font-family: inherit; }
  .scanner-input:focus { outline: none; border-color: var(--accent); }
  .scan-result { margin-top: 12px; padding: 12px; background: var(--card2); border-radius: 8px; border: 1px solid var(--border); }

  /* ── Buttons ── */
  .btn {
    background: linear-gradient(135deg, var(--accent), #7c3aed);
    color: #fff; border: none; border-radius: 8px; padding: 12px 24px;
    font-size: 14px; font-weight: 700; cursor: pointer; letter-spacing: .5px;
    transition: opacity .2s, transform .1s; white-space: nowrap;
  }
  .btn:hover:not(:disabled) { opacity: .9; transform: translateY(-1px); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-sm { padding: 8px 16px; font-size: 12px; border-radius: 6px; }
  .btn-outline { background: transparent; border: 1px solid var(--accent); color: var(--accent); }

  /* ── Holdings controls ── */
  .controls { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .input-sm { background: var(--card2); border: 1px solid var(--border2); color: var(--text); border-radius: 6px; padding: 8px 10px; font-size: 13px; width: 100px; }
  .input-sm:focus { outline: none; border-color: var(--accent); }
  .input-ticker { width: 80px; text-transform: uppercase; }

  /* ── Chart ── */
  .chart-wrap { height: 160px; position: relative; margin-top: 12px; }

  /* ── Grid for holdings ── */
  .holdings-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }

  /* ── Section headers ── */
  .section { margin-bottom: 20px; }
  .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .section-title { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted); }

  /* ── Loading ── */
  .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.2); border-top-color: #fff; border-radius: 50%; animation: spin .6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Empty state ── */
  .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
  .empty-icon  { font-size: 48px; margin-bottom: 16px; }

  /* ── Tooltip ── */
  .tooltip { position: relative; cursor: help; }

  /* ── Dimension bars ── */
  .dim-bars { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .dim-row  { display: flex; align-items: center; gap: 8px; }
  .dim-name { font-size: 10px; color: var(--muted); width: 80px; }
  .dim-track { flex: 1; height: 4px; background: var(--border2); border-radius: 2px; overflow: hidden; }
  .dim-fill  { height: 100%; border-radius: 2px; }
  .dim-val   { font-size: 10px; color: var(--text); width: 28px; text-align: right; }

  /* ── PnL coloring ── */
  .pos { color: var(--green); }
  .neg { color: var(--red); }

  /* ── Behavior sliders ── */
  .behavior-form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .bf-row { display: flex; flex-direction: column; gap: 4px; }
  .bf-label { font-size: 10px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); }
  .bf-val   { font-size: 12px; font-weight: 700; color: var(--accent); }
  .slider   { width: 100%; accent-color: var(--accent); cursor: pointer; }

  /* ── Modal / toast ── */
  .toast {
    position: fixed; bottom: 24px; right: 24px; z-index: 999;
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 18px; font-size: 13px; max-width: 320px;
    box-shadow: 0 8px 32px rgba(0,0,0,.5);
    animation: slideIn .3s ease;
  }
  @keyframes slideIn { from { transform: translateX(120%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ── Helpers ───────────────────────────────────────────────────────────────────
const API = (path, opts) =>
  fetch(path, opts).then(r => r.ok ? r.json() : Promise.reject(r));

const fmt  = n => n == null ? '—' : Number(n).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
const fmtp = n => n == null ? '—' : `${n > 0 ? '+' : ''}${Number(n).toFixed(2)}%`;
const clampColor = (val, min=0, max=10) => {
  const t = (val - min) / (max - min);
  if (t < 0.3) return '#ef4444';
  if (t < 0.5) return '#f97316';
  if (t < 0.7) return '#eab308';
  if (t < 0.85) return '#22c55e';
  return '#3b82f6';
};
const trapColor = t => t < 0.3 ? '#22c55e' : t < 0.6 ? '#eab308' : t < 0.8 ? '#f97316' : '#ef4444';
const yunusColor = s => s >= 75 ? '#22c55e' : s >= 50 ? '#eab308' : '#ef4444';

const TRAJ_COLORS = {
  ESCALATING:'#ef4444', ASCENDING:'#22c55e', RECOVERING:'#06b6d4',
  TRAPPED:'#a855f7', STABLE:'#3b82f6', OSCILLATING:'#f59e0b',
};
const TRAJ_ICONS = {
  ESCALATING:'📈', ASCENDING:'🚀', RECOVERING:'🔄',
  TRAPPED:'🔒', STABLE:'⚖️', OSCILLATING:'〰️',
};

// ── Stage Ring ────────────────────────────────────────────────────────────────
function StageRing({ stage, color, size=44 }) {
  return (
    <div className="stage-badge" style={{ width:size, height:size, borderColor:color, color, fontSize:size*.38 }}>
      {stage}
    </div>
  );
}

// ── Yunus Ring ────────────────────────────────────────────────────────────────
function YunusRing({ score }) {
  const c = yunusColor(score);
  const r = 38, circ = 2 * Math.PI * r;
  const fill = circ - (score/100)*circ;
  return (
    <div className="yunus-ring">
      <svg width="100" height="100" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r={r} fill="none" stroke="#1a2d50" strokeWidth="8"/>
        <circle cx="50" cy="50" r={r} fill="none" stroke={c} strokeWidth="8"
          strokeDasharray={circ} strokeDashoffset={fill} strokeLinecap="round"/>
      </svg>
      <div className="yunus-ring-label" style={{color:c}}>{score}</div>
    </div>
  );
}

// ── Dim Bars ──────────────────────────────────────────────────────────────────
function DimBars({ dims }) {
  const entries = [
    ['Adaptability', dims.adaptability, '#06b6d4'],
    ['Coherence',    dims.coherence,    '#3b82f6'],
    ['Stability',    dims.stability,    '#22c55e'],
    ['Tension',      dims.tension,      '#ef4444'],
  ];
  return (
    <div className="dim-bars">
      {entries.map(([name, val, col]) => (
        <div className="dim-row" key={name}>
          <div className="dim-name">{name}</div>
          <div className="dim-track">
            <div className="dim-fill" style={{width:`${val*10}%`, background:col}}/>
          </div>
          <div className="dim-val">{val?.toFixed(1)}</div>
        </div>
      ))}
    </div>
  );
}

// ── Holding Card ──────────────────────────────────────────────────────────────
function HoldingCard({ h }) {
  const [expanded, setExpanded] = useState(false);
  const cls = h.false_light ? 'holding-card false-light' : h.stage <= 2 ? 'holding-card critical' : 'holding-card';
  return (
    <div className={cls} onClick={()=>setExpanded(e=>!e)}>
      <div className="holding-top">
        <StageRing stage={h.stage} color={h.stage_color} size={36}/>
        <div style={{flex:1}}>
          <div style={{display:'flex', alignItems:'center', gap:6}}>
            <span className="h-ticker">{h.ticker}</span>
            {h.false_light && <span className="fl-badge">FALSE LIGHT</span>}
            {h.reroute_suggested && <span className="fl-badge" style={{background:'#ef4444'}}>REROUTE</span>}
          </div>
          <div style={{fontSize:10, color:'#64748b'}}>{h.stage_label}</div>
        </div>
        <div style={{textAlign:'right'}}>
          <div className="h-price">${fmt(h.price)}</div>
          <div className={`h-chg ${h.change_pct>=0?'pos':'neg'}`}>{fmtp(h.change_pct)}</div>
        </div>
      </div>

      <div style={{display:'flex', justifyContent:'space-between', fontSize:12}}>
        <span style={{color:'#64748b'}}>{h.shares} shares · ${fmt(h.position_value)}</span>
        <span className={h.pnl_pct>=0?'pos':'neg'}>{fmtp(h.pnl_pct)} P&L</span>
      </div>

      <div className="trap-bar">
        <span className="trap-label" style={{color: trapColor(h.trap_score)}}>
          TrapScore {h.trap_score?.toFixed(2)}
        </span>
        <div className="trap-bar-track">
          <div className="trap-bar-fill"
            style={{width:`${h.trap_score*100}%`, background: trapColor(h.trap_score)}}/>
        </div>
      </div>

      {expanded && (
        <>
          <div className="holding-desc">{h.description}</div>
          <DimBars dims={h.dimensions}/>
          <div style={{display:'flex', gap:8, flexWrap:'wrap', marginTop:4}}>
            <span style={{fontSize:10, color:'#64748b'}}>
              1W: <span className={h.week_change_pct>=0?'pos':'neg'}>{fmtp(h.week_change_pct)}</span>
            </span>
            <span style={{fontSize:10, color:'#64748b'}}>
              1M: <span className={h.month_change_pct>=0?'pos':'neg'}>{fmtp(h.month_change_pct)}</span>
            </span>
            <span style={{fontSize:10, color:'#64748b'}}>Vol: {h.volatility}%</span>
            {!h.real_data && <span style={{fontSize:10, color:'#f59e0b'}}>⚠ Demo data</span>}
          </div>
        </>
      )}
    </div>
  );
}

// ── Stage History Chart ───────────────────────────────────────────────────────
function StageChart({ history, trapHistory }) {
  const ref = useRef(null);
  const chart = useRef(null);
  useEffect(()=>{
    if (!ref.current || !history?.length) return;
    if (chart.current) chart.current.destroy();
    chart.current = new Chart(ref.current, {
      type:'line',
      data:{
        labels: history.map((_,i)=>`#${i+1}`),
        datasets:[
          {
            label:'Portfolio Stage', data:history, borderColor:'#06b6d4', backgroundColor:'rgba(6,182,212,.08)',
            borderWidth:2, pointRadius:4, pointBackgroundColor:'#06b6d4', tension:.3, fill:true,
          },
          trapHistory?.length ? {
            label:'TrapScore ×9', data:trapHistory.map(t=>t*9), borderColor:'#f97316',
            backgroundColor:'rgba(249,115,22,.04)', borderWidth:1.5,
            pointRadius:0, tension:.3, fill:false, borderDash:[4,4],
          } : null
        ].filter(Boolean),
      },
      options:{
        responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{ display: history.length > 5, labels:{color:'#94a3b8', font:{size:10}}}},
        scales:{
          x:{ ticks:{color:'#475569', font:{size:9}}, grid:{color:'rgba(255,255,255,.04)'} },
          y:{ min:0, max:9, ticks:{color:'#475569', font:{size:9}, stepSize:1}, grid:{color:'rgba(255,255,255,.06)'} },
        },
      },
    });
    return ()=>{ if(chart.current) chart.current.destroy(); };
  },[history, trapHistory]);
  if (!history?.length) return null;
  return <div className="chart-wrap"><canvas ref={ref}/></div>;
}

// ── Main App ──────────────────────────────────────────────────────────────────
function App() {
  const [analysis,   setAnalysis]   = useState(null);
  const [loading,    setLoading]    = useState(false);
  const [holdings,   setHoldings]   = useState([]);
  const [newTicker,  setNewTicker]  = useState('');
  const [newShares,  setNewShares]  = useState('10');
  const [newCost,    setNewCost]    = useState('');
  const [yunusText,  setYunusText]  = useState('');
  const [yunusScan,  setYunusScan]  = useState(null);
  const [scanLoading,setScanLoading]= useState(false);
  const [toast,      setToast]      = useState(null);
  const [serverOk,   setServerOk]   = useState(null);
  const [behavior,   setBehavior]   = useState({
    win_rate:.52, avg_hold_days:28, top3_concentration:.42,
    max_drawdown:.12, leverage_ratio:1.0, plan_override_count:1, portfolio_correlation:.45,
  });

  // Health check + load demo
  useEffect(()=>{
    API('/api/health').then(()=>{
      setServerOk(true);
      API('/api/portfolio/demo').then(d=>{
        setHoldings(d.holdings.map(h=>({...h, id:Math.random()})));
      }).catch(()=>{});
    }).catch(()=>setServerOk(false));
  },[]);

  const showToast = msg => { setToast(msg); setTimeout(()=>setToast(null), 3500); };

  const runAnalysis = useCallback(async ()=>{
    if (!holdings.length) { showToast('Add at least one holding first.'); return; }
    setLoading(true);
    try {
      const res = await API('/api/analyze', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          holdings: holdings.map(h=>({ticker:h.ticker, shares:parseFloat(h.shares)||10, avg_cost:parseFloat(h.avg_cost)||0})),
          user_behavior: behavior,
        }),
      });
      setAnalysis(res);
      showToast('Analysis complete ✓');
    } catch(e) {
      showToast('Analysis failed — check server connection.');
    } finally { setLoading(false); }
  },[holdings, behavior]);

  const addHolding = () => {
    const t = newTicker.trim().toUpperCase();
    if (!t) return;
    if (holdings.find(h=>h.ticker===t)) { showToast(`${t} already in portfolio`); return; }
    setHoldings(hs=>[...hs, {id:Math.random(), ticker:t, shares:parseFloat(newShares)||10, avg_cost:parseFloat(newCost)||0}]);
    setNewTicker(''); setNewShares('10'); setNewCost('');
  };

  const removeHolding = id => setHoldings(hs=>hs.filter(h=>h.id!==id));

  const runYunusScan = async () => {
    if (!yunusText.trim()) return;
    setScanLoading(true);
    try {
      const res = await API('/api/yunus_scan', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          text: yunusText,
          stage: analysis?.overall_stage ?? 5,
          coherence: analysis?.holdings?.[0]?.dimensions?.coherence ?? 5,
        }),
      });
      setYunusScan(res);
    } catch { showToast('Scan failed.'); }
    finally { setScanLoading(false); }
  };

  const traj = analysis?.trajectory;
  const har  = analysis?.harrowing;
  const user = analysis?.user;
  const sys  = analysis?.systemic_alert;

  return (
    <div className="app">
      {/* HEADER */}
      <div className="header">
        <div className="header-brand">
          <div className="header-logo">𓂀</div>
          <div>
            <div className="header-title">ANUBIS</div>
            <div className="header-sub">LUMINARK Portfolio Intelligence</div>
          </div>
        </div>
        <div style={{display:'flex', alignItems:'center', gap:16}}>
          <div className="header-status">
            <div className={`dot ${serverOk===false?'offline':''}`}/>
            <span>{serverOk===null?'Connecting…':serverOk?`Live${analysis?.real_data?' · Real Data':' · Demo Mode'}` : 'Server Offline'}</span>
          </div>
          <button className="btn" onClick={runAnalysis} disabled={loading||!holdings.length}>
            {loading ? <><span className="spinner"/> Analyzing…</> : '⚡ Analyze Portfolio'}
          </button>
        </div>
      </div>

      {/* SYSTEMIC ALERT BANNER */}
      {sys?.active && (
        <div className="systemic-banner" style={{background:`${sys.color}12`, borderColor:sys.color}}>
          <div className="systemic-icon">🚨</div>
          <div>
            <div className="systemic-label" style={{color:sys.color}}>{sys.label} — Level {sys.level}</div>
            <div className="systemic-desc">{sys.description}</div>
            {sys.domains_declining.length > 0 && (
              <div style={{marginTop:4, display:'flex', gap:6, flexWrap:'wrap'}}>
                {sys.domains_declining.map(d=>(
                  <span key={d} style={{fontSize:10, padding:'2px 8px', borderRadius:20, background:`${sys.color}22`, color:sys.color}}>
                    {d.replace('_',' ')}
                  </span>
                ))}
              </div>
            )}
          </div>
        </div>
      )}

      {/* OVERVIEW STATS */}
      {analysis && (
        <div className="overview">
          <div className="ov-card">
            <div className="ov-label">Portfolio Stage</div>
            <div className="ov-value" style={{color:analysis.overall_color}}>{analysis.overall_stage}</div>
            <div className="ov-sub">{analysis.overall_label}</div>
          </div>
          <div className="ov-card">
            <div className="ov-label">Total Value</div>
            <div className="ov-value">${(analysis.total_value/1000).toFixed(1)}K</div>
            <div className={`ov-sub ${analysis.portfolio_pnl_pct>=0?'pos':'neg'}`}>{fmtp(analysis.portfolio_pnl_pct)} total P&L</div>
          </div>
          <div className="ov-card">
            <div className="ov-label">TrapScore</div>
            <div className="ov-value" style={{color:trapColor(analysis.overall_trap_score)}}>
              {(analysis.overall_trap_score*100).toFixed(0)}
            </div>
            <div className="ov-sub">/ 100</div>
          </div>
          <div className="ov-card">
            <div className="ov-label">Trajectory</div>
            <div className="ov-value" style={{color:TRAJ_COLORS[traj?.label]||'#94a3b8', fontSize:18}}>
              {TRAJ_ICONS[traj?.label]} {traj?.label||'—'}
            </div>
            <div className="ov-sub">{traj?.sample_count} snapshots</div>
          </div>
          <div className="ov-card">
            <div className="ov-label">Yunus Score</div>
            <div className="ov-value" style={{color:yunusColor(user?.yunus_score||0)}}>{user?.yunus_score||'—'}</div>
            <div className="ov-sub">Epistemic Humility</div>
          </div>
          <div className="ov-card">
            <div className="ov-label">Trader Stage</div>
            <div className="ov-value" style={{color:user?.stage_color}}>{user?.user_stage ?? '—'}</div>
            <div className="ov-sub">{user?.archetype||'—'}</div>
          </div>
        </div>
      )}

      {/* MAIN GRID */}
      <div className="main-grid">

        {/* LEFT: Holdings */}
        <div>
          {/* Portfolio Controls */}
          <div className="card" style={{marginBottom:16}}>
            <div className="card-title">Portfolio Holdings</div>
            <div className="controls">
              <input className="input-sm input-ticker" placeholder="TICKER"
                value={newTicker} onChange={e=>setNewTicker(e.target.value.toUpperCase())}
                onKeyDown={e=>e.key==='Enter'&&addHolding()}/>
              <input className="input-sm" placeholder="Shares" type="number" min="0.01"
                value={newShares} onChange={e=>setNewShares(e.target.value)}/>
              <input className="input-sm" placeholder="Avg Cost" type="number" min="0"
                value={newCost} onChange={e=>setNewCost(e.target.value)}/>
              <button className="btn btn-sm" onClick={addHolding}>+ Add</button>
              <button className="btn btn-sm btn-outline" onClick={()=>{
                API('/api/portfolio/demo').then(d=>{
                  setHoldings(d.holdings.map(h=>({...h,id:Math.random()})));
                  showToast('Demo portfolio loaded');
                });
              }}>Load Demo</button>
            </div>

            {/* Portfolio list */}
            {holdings.length === 0 ? (
              <div className="empty-state">
                <div className="empty-icon">📊</div>
                <div>Add holdings above or load the demo portfolio</div>
              </div>
            ) : (
              <div style={{display:'flex', flexDirection:'column', gap:6}}>
                {holdings.map(h=>(
                  <div key={h.id} style={{display:'flex', alignItems:'center', gap:8, padding:'8px 10px', background:'var(--card2)', borderRadius:8, border:'1px solid var(--border)'}}>
                    <span style={{fontWeight:800, width:60}}>{h.ticker}</span>
                    <span style={{color:'var(--muted)', fontSize:12}}>{h.shares} shares</span>
                    {h.avg_cost>0 && <span style={{color:'var(--muted)', fontSize:12}}>@ ${h.avg_cost}</span>}
                    <button onClick={()=>removeHolding(h.id)} style={{marginLeft:'auto', background:'none', border:'none', color:'var(--red)', cursor:'pointer', fontSize:16}}>×</button>
                  </div>
                ))}
              </div>
            )}
          </div>

          {/* Analyzed Holdings Grid */}
          {analysis?.holdings?.length > 0 && (
            <div className="section">
              <div className="section-header">
                <div className="section-title">Holding Analysis</div>
                <div style={{fontSize:11, color:'var(--muted)'}}>Click a card to expand</div>
              </div>
              <div className="holdings-grid">
                {analysis.holdings.map(h=><HoldingCard key={h.ticker} h={h}/>)}
              </div>
            </div>
          )}

          {/* Rebalance Suggestions */}
          {analysis?.rebalance?.length > 0 && (
            <div className="section">
              <div className="card">
                <div className="card-title">⚡ InfraAdaptiveCamouflage — Rebalance Suggestions</div>
                <div style={{fontSize:11, color:'var(--muted)', marginBottom:10}}>
                  Rerouting {60}% of critical positions to healthy holdings (LUMINARK protocol)
                </div>
                {analysis.rebalance.map((r,i)=>(
                  <div className="rebalance-row" key={i}>
                    <span>Move</span>
                    <span className="rb-pct">{r.pct}%</span>
                    <span>of</span>
                    <span className="rb-from">{r.from_ticker} <span style={{fontSize:10, color:'var(--muted)'}}>Stg {r.from_stage}</span></span>
                    <span>→</span>
                    <span className="rb-to">{r.to_ticker} <span style={{fontSize:10, color:'var(--muted)'}}>Stg {r.to_stage}</span></span>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* Yunus Scanner */}
          <div className="section">
            <div className="card">
              <div className="card-title">🧠 Yunus Protocol — Epistemic Safety Scanner</div>
              <div style={{fontSize:11, color:'var(--muted)', marginBottom:10}}>
                Paste your trading notes or rationale. ANUBIS will scan for overconfidence patterns and False Light signals.
              </div>
              <textarea className="scanner-input"
                placeholder="e.g. 'NVDA is a sure thing, can't lose here. Going all in…'"
                value={yunusText} onChange={e=>setYunusText(e.target.value)}/>
              <div style={{display:'flex', justifyContent:'flex-end', marginTop:8}}>
                <button className="btn btn-sm" onClick={runYunusScan} disabled={scanLoading||!yunusText.trim()}>
                  {scanLoading ? <span className="spinner"/> : '🔍 Scan'}
                </button>
              </div>
              {yunusScan && (
                <div className="scan-result">
                  <div style={{display:'flex', alignItems:'center', gap:12, marginBottom:10}}>
                    <YunusRing score={yunusScan.yunus_score}/>
                    <div>
                      <div style={{fontWeight:800, fontSize:15, color:yunusColor(yunusScan.yunus_score)}}>
                        {yunusScan.output_safe ? '✓ Output Safe' : '⚠ Output Flagged'}
                      </div>
                      <div style={{fontSize:11, color:'var(--muted)', marginTop:2}}>Yunus Score {yunusScan.yunus_score}/100</div>
                    </div>
                  </div>
                  {yunusScan.flags.map(f=>(
                    <div key={f} style={{fontSize:11, padding:'4px 8px', background:'rgba(249,115,22,.1)', borderRadius:4, marginBottom:4, color:'var(--orange)'}}>
                      🚩 {f.replace(/_/g,' ')}
                    </div>
                  ))}
                  {yunusScan.detected_markers.length > 0 && (
                    <div style={{fontSize:11, color:'var(--muted)', marginTop:6}}>
                      Markers: {yunusScan.detected_markers.map(m=>`"${m}"`).join(' · ')}
                    </div>
                  )}
                  <div style={{marginTop:10, fontSize:12, padding:'8px 10px', background:'var(--bg)', borderRadius:6, borderLeft:'3px solid var(--accent)', color:'var(--text)'}}>
                    {yunusScan.recommendation}
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>

        {/* RIGHT PANEL */}
        <div className="right-stack">

          {/* Trajectory */}
          <div className="card">
            <div className="card-title">📡 Trajectory Engine</div>
            {traj?.label ? (
              <>
                <div className="traj-label" style={{color: TRAJ_COLORS[traj.label]}}>
                  {TRAJ_ICONS[traj.label]} {traj.label}
                </div>
                <div style={{fontSize:11, color:'var(--muted)', marginTop:4}}>
                  {traj.sample_count} analysis snapshots recorded
                </div>
                <div className="traj-metrics">
                  {[
                    ['Stage Velocity', traj.stage_velocity?.toFixed(3), traj.stage_velocity>0?'var(--green)':'var(--red)'],
                    ['Risk Momentum',  traj.risk_momentum?.toFixed(3),  traj.risk_momentum>0?'var(--red)':'var(--green)'],
                    ['Rigidity Index', (traj.rigidity_index*100).toFixed(0)+'%', traj.rigidity_index>0.5?'var(--orange)':'var(--blue)'],
                    ['Recovery Index', (traj.recovery_index*100).toFixed(0)+'%', traj.recovery_index>0.5?'var(--green)':'var(--muted)'],
                  ].map(([label,val,col])=>(
                    <div className="traj-metric" key={label}>
                      <div className="traj-metric-label">{label}</div>
                      <div className="traj-metric-val" style={{color:col}}>{val}</div>
                    </div>
                  ))}
                </div>
                <StageChart history={traj.stage_history} trapHistory={traj.trap_history}/>
              </>
            ) : (
              <div style={{color:'var(--muted)', fontSize:12, padding:'10px 0'}}>
                Run an analysis to begin trajectory tracking. Each analysis adds a snapshot to the session memory.
              </div>
            )}
          </div>

          {/* Trader Behavior */}
          <div className="card">
            <div className="card-title">👤 Trader Behavior Profile</div>
            <div className="behavior-form">
              {[
                ['Win Rate',       'win_rate',           0,1,   0.01],
                ['Avg Hold Days',  'avg_hold_days',       0,365, 1  ],
                ['Top-3 Conc.',    'top3_concentration',  0,1,   0.01],
                ['Max Drawdown',   'max_drawdown',        0,0.5, 0.01],
                ['Leverage Ratio', 'leverage_ratio',      1,5,   0.1 ],
                ['Plan Overrides', 'plan_override_count', 0,20,  1   ],
              ].map(([label, key, min, max, step])=>(
                <div className="bf-row" key={key}>
                  <div className="bf-label">{label}</div>
                  <div className="bf-val">
                    {key==='win_rate'||key==='top3_concentration'||key==='max_drawdown'
                      ? `${(behavior[key]*100).toFixed(0)}%`
                      : behavior[key]}
                  </div>
                  <input type="range" className="slider" min={min} max={max} step={step}
                    value={behavior[key]}
                    onChange={e=>setBehavior(b=>({...b,[key]:parseFloat(e.target.value)}))}/>
                </div>
              ))}
            </div>
            {user && (
              <div style={{marginTop:12, padding:'10px 12px', background:'var(--card2)', borderRadius:8, border:'1px solid var(--border)'}}>
                <div style={{display:'flex', alignItems:'center', gap:10}}>
                  <StageRing stage={user.user_stage} color={user.stage_color} size={38}/>
                  <div>
                    <div style={{fontWeight:800}}>{user.archetype}</div>
                    <div style={{fontSize:11, color:'var(--muted)'}}>Stage {user.user_stage} — {user.stage_label}</div>
                  </div>
                  <div style={{marginLeft:'auto', textAlign:'right'}}>
                    <div style={{fontSize:11, color:'var(--muted)'}}>Yunus</div>
                    <div style={{fontWeight:800, color:yunusColor(user.yunus_score)}}>{user.yunus_score}</div>
                  </div>
                </div>
                {user.trap_risk && (
                  <div style={{marginTop:8, fontSize:11, color:'var(--orange)', padding:'6px 8px', background:'rgba(249,115,22,.08)', borderRadius:6}}>
                    ⚠ Stage 8 Trap risk detected — TrapScore {user.trap_score?.toFixed(2)}
                  </div>
                )}
                <div style={{fontSize:11, color:'var(--muted)', marginTop:8}}>{user.description}</div>
                {user.dimensions && <DimBars dims={user.dimensions}/>}
              </div>
            )}
          </div>

          {/* Harrowing */}
          <div className="card">
            <div className="card-title">🏥 Harrowing Protocol</div>
            {har ? (
              <div className={`harrowing-status ${har.quarantine_risk?'quarantine':har.active?'active':'normal'}`}>
                <div style={{fontWeight:800, fontSize:14}}>
                  {har.quarantine_risk ? '🔴 QUARANTINE MODE' : har.active ? '⚠️ HARROWING ACTIVE' : '✅ NORMAL — Stable'}
                </div>
                {har.last_stable_stage != null && (
                  <div style={{fontSize:12, marginTop:8}}>
                    <span style={{color:'var(--muted)'}}>Last stable baseline: </span>
                    <span style={{fontWeight:700, color:'var(--green)'}}>Stage {har.last_stable_stage}</span>
                    {har.last_stable_at && <span style={{color:'var(--muted)'}}> · {har.last_stable_at}</span>}
                  </div>
                )}
                <div style={{fontSize:11, color:'var(--muted)', marginTop:8, lineHeight:1.5}}>
                  {har.restoration_action}
                </div>
              </div>
            ) : (
              <div style={{color:'var(--muted)', fontSize:12}}>
                Run an analysis to activate the Harrowing Protocol and begin stable-state preservation.
              </div>
            )}
          </div>

          {/* Threats */}
          {analysis?.threats?.length > 0 && (
            <div className="card">
              <div className="card-title">⚠️ Active Threats</div>
              {analysis.threats.map((t,i)=>{
                const sevColors = {CRITICAL:'#ef4444', HIGH:'#f97316', MEDIUM:'#eab308'};
                const col = sevColors[t.severity]||'#64748b';
                return (
                  <div className="threat-item" key={i} style={{borderLeftColor:col}}>
                    <div style={{flex:1}}>
                      <div style={{display:'flex', alignItems:'center', gap:6}}>
                        <span style={{fontWeight:800}}>{t.ticker}</span>
                        <span className="threat-sev" style={{background:`${col}22`, color:col}}>{t.severity}</span>
                        <span style={{fontSize:10, color:'var(--muted)'}}>{t.type.replace(/_/g,' ')}</span>
                      </div>
                      <div className="threat-desc">{t.description}</div>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      </div>

      {/* TOAST */}
      {toast && <div className="toast">{toast}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
